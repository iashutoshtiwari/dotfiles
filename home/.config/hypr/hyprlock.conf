general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 1500
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

background {
    monitor =

    path =
    reload_cmd = cat /home/ashutosh/.local/state/predator-shell/wallpaper

    color = rgb(1e1e2e)

    blur_passes = 2
    blur_size = 7

    brightness = 0.60
    contrast = 0.90
    vibrancy = 0.12
    vibrancy_darkness = 0.05
    noise = 0.0
}

# Time
label {
    monitor =
    text = $TIME

    color = rgb(cdd6f4)

    font_size = 64
    font_family = JetBrainsMono Nerd Font

    position = 0, 155
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date "+%A, %d %B"

    color = rgb(a6adc8)

    font_size = 14
    font_family = JetBrainsMono Nerd Font

    position = 0, 95
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER

    color = rgb(b4befe)

    font_size = 13
    font_family = JetBrainsMono Nerd Font

    position = 0, 18
    halign = center
    valign = center
}

input-field {
    monitor =

    size = 360, 48
    position = 0, -45

    halign = center
    valign = center

    outline_thickness = 2

    outer_color = rgb(b4befe)
    inner_color = rgb(181825)
    font_color = rgb(cdd6f4)

    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)

    font_family = JetBrainsMono Nerd Font

    dots_size = 0.20
    dots_spacing = 0.20
    dots_center = true
    dots_rounding = 0

    rounding = 0

    fade_on_empty = false

    placeholder_text = Password
    fail_text = $FAIL
}
