"$schema" = 'https://starship.rs/config-schema.json'
palette = "catppuccin_mocha"

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$cmd_duration\
$status\
$line_break\
$character"""

[directory]
style             = "bold lavender"
truncation_length = 4
truncate_to_repo  = true
read_only         = " 󰌾"

[git_branch]
symbol = " "
style  = "bold mauve"
format = "on [$symbol$branch]($style) "

[git_status]
style            = "red"
format           = "([$all_status$ahead_behind]($style) )"
conflicted       = "󰩜 "
ahead            = "⇡${count} "
behind           = "⇣${count} "
diverged         = "⇕ "
untracked        = "? "
stashed          = "$ "
modified         = "! "
staged           = "+ "
deleted          = "✘ "

[character]
success_symbol = "[❯](green)"
error_symbol   = "[❯](red)"
vimcmd_symbol  = "[❮](mauve)"

[cmd_duration]
min_time = 2000
style    = "peach"
format   = "took [$duration]($style) "

[status]
style    = "red"
format   = "[$symbol$status]($style) "
symbol   = "✘ "
disabled = false

[python]
symbol = " "
style  = "blue"
format = "via [$symbol$version]($style) "

[nodejs]
symbol = " "
style  = "green"
format = "via [$symbol$version]($style) "

[rust]
symbol = " "
style  = "peach"
format = "via [$symbol$version]($style) "

[package]
disabled = true

# Official Catppuccin Mocha palette. Prompt modules use semantic names so the
# relationship to upstream remains obvious while our compact layout stays local.
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
